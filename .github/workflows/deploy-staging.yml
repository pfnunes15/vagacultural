name: Deploy to staging

# Automatic deploy to the staging host over SSH.
# Triggers on a push to the `staging` branch, or manually from the Actions tab.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST      host, e.g. staging.vagacultural.pt
#   SSH_USERNAME  SSH user
#   SSH_KEY       private key (its public key is authorised on the host)
#   SSH_APP_PATH  absolute path of the app on the host, e.g. /home/user/staging
#   SSH_PORT      (optional) SSH port, defaults to 22
#
# The server keeps its own .env (never synced). See DEPLOY.md for the one-time host setup.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files (rsync over SSH)
        run: |
          rsync -az --no-perms --omit-dir-times \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            --exclude-from=.deployignore \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_APP_PATH }}/"

      - name: Migrate and warm caches
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.SSH_APP_PATH }} && \
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache"
