name: Deploy to staging

# Automatic deploy to the FTP staging host.
# Triggers on a push to the `staging` branch, or manually from the Actions tab.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      host of the FTP server (e.g. ftp.vagacultural.pt)
#   FTP_USERNAME    FTP user
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  target dir on the host where the app lives (e.g. /staging/)
#
# This only syncs files. The database is set up once by importing the SQL dump
# via phpMyAdmin — see DEPLOY.md. The server keeps its own .env (never uploaded).

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Deploy files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.ftp-deploy-sync-state.json
            **/phpunit.xml
            **/pint.json
            **/phpstan.neon
            **/docker-compose.yml
            **/docker/**
            **/README.md
            **/DEPLOY.md
