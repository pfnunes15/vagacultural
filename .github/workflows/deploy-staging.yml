name: Deploy to staging

# Automatic deploy to the FTP staging host.
# Triggers on a push to the `staging` branch, or manually from the Actions tab.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      host of the FTP server (e.g. ftp.vagacultural.pt)
#   FTP_USERNAME    FTP user
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  target dir on the host where the app lives (e.g. /staging/ or /httpdocs/)
# Optional (enables automatic migrations over SSH — recommended when the host has SSH):
#   SSH_HOST, SSH_USERNAME, SSH_KEY, SSH_APP_PATH
#
# The server keeps its own .env (never uploaded). See DEPLOY.md for the one-time host setup.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Deploy files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # The host keeps its own state and .env; never wipe the remote tree.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.ftp-deploy-sync-state.json
            **/phpunit.xml
            **/pint.json
            **/phpstan.neon
            **/docker-compose.yml
            **/docker/**
            **/README.md
            **/DEPLOY.md

      - name: Run migrations over SSH
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SSH_APP_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
