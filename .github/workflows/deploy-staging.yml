name: Deploy to staging

# Push-to-deploy: um push para a branch `staging` faz build e envia por SSH
# para o Hostinger (vaga.admedia.pt), correndo as migrations com o PHP 8.4.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST      77.37.37.247
#   SSH_PORT      65002
#   SSH_USER      u707430235
#   SSH_KEY       chave privada (~/.ssh/vaga_deploy)
#   SSH_APP_PATH  domains/vaga.admedia.pt/vaga
#
# O servidor mantém o seu .env (nunca é enviado). public_html -> vaga/public (symlink).

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files (rsync over SSH)
        run: |
          rsync -az --no-perms --omit-dir-times \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            --exclude 'public/storage' \
            --exclude 'docker/' \
            --exclude 'docker-compose.yml' \
            --exclude 'phpunit.xml' \
            --exclude 'pint.json' \
            --exclude 'phpstan.neon' \
            --exclude 'database/dumps/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_APP_PATH }}/"

      - name: Migrate and refresh caches (PHP 8.4)
        run: |
          ssh -p ${{ secrets.SSH_PORT }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd ${{ secrets.SSH_APP_PATH }}; \
             /opt/alt/php84/usr/bin/php artisan migrate --force; \
             /opt/alt/php84/usr/bin/php artisan optimize:clear; \
             /opt/alt/php84/usr/bin/php artisan storage:link 2>/dev/null || true"
